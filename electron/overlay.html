<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controles de grabación</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div class="bar">
    <div class="status">
      <span id="dot" class="dot"></span>
      <div class="copy">
        <div id="label" class="label">Grabando pantalla</div>
        <div id="timer" class="timer">00:00</div>
      </div>
    </div>
    <div class="actions">
      <button id="pause" type="button" aria-label="Pausar grabación" title="Pausar">
        <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
      </button>
      <button id="stop" class="stop" type="button" aria-label="Detener grabación" title="Detener">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
